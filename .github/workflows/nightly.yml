name: Docker Nightly

on:
  push:
    branches:
      - master

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Lint Java sources (Checkstyle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq checkstyle
          cd ghidra-rpc-server
          make lint

      - name: Log into GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login https://ghcr.io -u ${{ github.actor }} --password-stdin

      # Building the ghidra-rpc image also compiles the Java against the
      # pinned Ghidra (tools/compile-check.sh, run from the Dockerfile), and
      # build-containers.sh stops on the first failure, so nothing is pushed
      # when the sources do not compile.
      - name: Test CLI
        run: |
          cd ghidra-headless-cli
          cargo test

      # End-to-end tests (tests/e2e/README.md), driven through the CLI: a real
      # RPC server on a throwaway local project, then one launched through
      # ghidra-headless.sh against a throwaway Ghidra Server (started from the
      # same download, on 127.0.0.1). Uses the Ghidra release the Dockerfile
      # pins.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: End-to-end tests
        run: |
          ver=$(sed -n 's/^ARG GHIDRA_VERSION=//p' ghidra-rpc-server/Dockerfile)
          date=$(sed -n 's/^ARG GHIDRA_DATE=//p' ghidra-rpc-server/Dockerfile)
          curl -fsSL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${ver}_build/ghidra_${ver}_PUBLIC_${date}.zip"
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="/tmp/ghidra_${ver}_PUBLIC" tests/e2e/run.sh

      - name: Push image to GitHub Container Registry
        run: |
          cd ghidra-rpc-server
          ./build-containers.sh
          echo "pushing to ghcr.io/${{ github.repository }}"
          docker image push ghcr.io/trolldemorted/ghidra-headless-cli/ghidra-server
          docker image push ghcr.io/trolldemorted/ghidra-headless-cli/ghidra-rpc

      - name: Trigger downstream CI
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_PAT }}
        run: |
          gh workflow run nightly.yml --repo Trolldemorted/claude-reversing
